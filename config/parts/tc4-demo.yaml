# 零件配置: tc4-demo(~/tempt 测试件)
# 未列出的项继承 config/service.yaml 默认;请求内联参数可再覆盖本文件
geometry:
  capsule_step: /home/yushen/tempt/capsule.step
  cavity_step: /home/yushen/tempt/cavity.step

materials:
  powder: tc4
  capsule: 20steel
  overrides: {}         # 例: {tc4: {yield_stress_mpa: 800}}

cycle: {}               # 空 = 继承主配置 900℃/120MPa/3h

mesh:
  mesh_size_mm: 6.0

numerics:
  time_step_s: 120
