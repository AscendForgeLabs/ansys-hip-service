[project]
name = "ansys-hip-service"
version = "0.1.0"
description = "HIP 仿真计算方法提供方 — 面向 HIPForm 的方法级 ANSYS/MAPDL 计算服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
  "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "gmsh>=4.12",
    "meshio>=5.3",
    "trimesh>=4.4",
    "jinja2>=3.1",
]

[project.optional-dependencies]
interactive = ["ansys-mapdl-core>=0.68"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ansys_hip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 真 MAPDL 运行(单许可,由 lead 串行执行)"]
